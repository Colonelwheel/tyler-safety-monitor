[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tyler-safety-monitor"
version = "0.0.1"
description = "Local Windows camera feasibility dashboard; emergency messaging disabled"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==1.0.1",
  "PySide6==6.11.2",
  "opencv-contrib-python==4.12.0.88",
  "numpy==2.2.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
tyler-safety-monitor = "tyler_safety_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
